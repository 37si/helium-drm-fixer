name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, without the leading v
        required: true
        default: 0.0.0-dev

permissions:
  contents: write

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...

      - run: go test -race ./...
        env:
          CGO_ENABLED: "1"

  build:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Resolve version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        id: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail

          name="hdf_${VERSION}_${GOOS}_${GOARCH}"
          if [ "${GOOS}" = "windows" ]; then
            name="${name}.exe"
          fi

          mkdir -p dist
          go build -trimpath -buildvcs=false \
            -ldflags "-s -w -X main.version=${VERSION} -X main.repo=${GITHUB_REPOSITORY}" \
            -o "dist/${name}" .

          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: ./dist/${{ steps.build.outputs.name }} --version

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.name }}
          path: dist/${{ steps.build.outputs.name }}
          if-no-files-found: error
          retention-days: 7

  checksums:
    name: sha256
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write sha256.txt
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum hdf_* | sort -k2 > sha256.txt
          cat sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: sha256
          path: dist/sha256.txt
          if-no-files-found: error

  publish:
    name: publish
    needs: checksums
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Point the installers at this repository
        run: |
          set -euo pipefail
          for script in install.sh install.ps1; do
            sed "s|37si/helium-drm-fixer|${GITHUB_REPOSITORY}|g" "scripts/${script}" > "dist/${script}"
          done
          head -8 dist/install.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}
        run: |
          set -euo pipefail
          chmod +x dist/hdf_*

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes
          fi
